# ── Countdown Minuten-Wahl Mini-Overlay ──────────────────────────────────────────
# Wiederverwendbar für alle 6 Slots.
# Vor dem Einblenden per Lambda setzen:
#   overlay_cd_slot = <Slot-Index 0-5>
#   overlay_cd_mode = 0 (neuer Countdown) | 1 (Zeit-Update ohne Neustart)
# Layout: 400×93px, 1 Reihe buttonmatrix mit 7 Zellen
#   1 | 2 | 3 | 7 | 8 | 9 | X
# 2 Widgets (1× buttonmatrix + container)
# ─────────────────────────────────────────────────────────────────────────────────

obj:
  id: overlay_cd_mini
  width: 400
  height: 93
  align: TOP_LEFT
  x: 15
  y: 110
  bg_color: 0x222222
  bg_opa: 97%
  border_width: 2
  border_color: 0x888888
  radius: 12
  hidden: true
  pad_all: 4
  scrollable: false
  clickable: false
  widgets:
    - buttonmatrix:
        id: btnmatrix_cd_mini
        width: 100%
        height: 100%
        align: CENTER
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        items:
          bg_color: 0x444444
          bg_opa: COVER
          border_width: 0
          radius: 6
          text_font: font_cd_btn
          text_color: 0xFFFFFF
          checked:
            bg_color: 0x882222
            bg_opa: COVER
        rows:
          - buttons:
              - text: "1"
              - text: "2"
              - text: "3"
              - text: "7"
              - text: "8"
              - text: "9"
              - text: "X"
        on_press:
          - lambda: |-
              uint32_t btn = lv_buttonmatrix_get_selected_button((lv_obj_t*)lv_event_get_target(event));
              const int mins[] = {1, 2, 3, 7, 8, 9};
              if (btn < 6) {
                id(set_countdown_minutes).execute(mins[btn]);
              } else {
                lv_obj_add_flag(id(overlay_cd_mini), LV_OBJ_FLAG_HIDDEN);
                // X-Button nach dem Toggle sofort wieder rot setzen
                lv_buttonmatrix_set_button_ctrl(id(btnmatrix_cd_mini)->obj, 6,
                  (lv_buttonmatrix_ctrl_t)(LV_BUTTONMATRIX_CTRL_CHECKABLE | LV_BUTTONMATRIX_CTRL_CHECKED));
              }
