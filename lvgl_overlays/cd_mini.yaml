# ── Countdown Minuten-Wahl Mini-Overlay ──────────────────────────────────────────
# Wiederverwendbar für alle 6 Slots.
# Vor dem Einblenden per Lambda setzen:
#   overlay_cd_slot = <Slot-Index 0-5>
#   overlay_cd_mode = 0 (neuer Countdown) | 1 (Zeit-Update ohne Neustart)
#   lv_obj_set_pos(id(overlay_cd_mini), x, y)
#   Rot-Highlight: overlay_cd_selected_min[slot] vorab prüfen + Buttons einfärben
# Layout: 290×120px, 2 Zeilen à 5 Buttons
#   Zeile 1: 1  2  3  4  5
#   Zeile 2: 6  7  8  9  X
# Jeder Button: 52×54px, Abstand x=4px, Abstand y=4px, Rand links/rechts=6px
# ─────────────────────────────────────────────────────────────────────────────────

obj:
  id: overlay_cd_mini
  width: 290
  height: 120
  align: TOP_LEFT
  x: 15
  y: 110
  bg_color: 0x222222
  bg_opa: 97%
  border_width: 2
  border_color: 0x888888
  radius: 12
  hidden: true
  pad_all: 0
  scrollable: false
  clickable: false
  widgets:

    # ── Zeile 1: Buttons 1–5 ──────────────────────────────────────────────────

    - button:
        id: btn_cdm_1
        width: 52
        height: 54
        align: TOP_LEFT
        x: 6
        y: 4
        bg_color: 0x444444
        border_width: 0
        shadow_width: 0
        outline_width: 0
        radius: 6
        pad_all: 0
        on_click:
          - script.execute:
              id: set_countdown_minutes
              minutes: 1
        widgets:
          - label:
              align: CENTER
              text: "1"
              text_font: font_normal
              text_color: 0xFFFFFF

    - button:
        id: btn_cdm_2
        width: 52
        height: 54
        align: TOP_LEFT
        x: 62
        y: 4
        bg_color: 0x444444
        border_width: 0
        shadow_width: 0
        outline_width: 0
        radius: 6
        pad_all: 0
        on_click:
          - script.execute:
              id: set_countdown_minutes
              minutes: 2
        widgets:
          - label:
              align: CENTER
              text: "2"
              text_font: font_normal
              text_color: 0xFFFFFF

    - button:
        id: btn_cdm_3
        width: 52
        height: 54
        align: TOP_LEFT
        x: 118
        y: 4
        bg_color: 0x444444
        border_width: 0
        shadow_width: 0
        outline_width: 0
        radius: 6
        pad_all: 0
        on_click:
          - script.execute:
              id: set_countdown_minutes
              minutes: 3
        widgets:
          - label:
              align: CENTER
