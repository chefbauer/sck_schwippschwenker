# ── Countdown Minuten-Wahl Mini-Overlay ──────────────────────────────────────────
# Wiederverwendbar für alle 6 Slots.
# Vor dem Einblenden per Lambda setzen:
#   overlay_cd_slot = <Slot-Index 0-5>
#   overlay_cd_mode = 0 (neuer Countdown) | 1 (Zeit-Update ohne Neustart)
#   lv_obj_set_pos(id(overlay_cd_mini), x, y)
#   Rot-Highlight: overlay_cd_selected_min[slot] vorab prüfen + Buttons einfärben
# Layout: 290×120px, 2 Zeilen à 5 Buttons
#   Zeile 1: 1  2  3  4  5
#   Zeile 2: 6  7  8  9  X
# Jeder Button: 52×54px, Abstand x=4px, Abstand y=4px, Rand links/rechts=6px
# ─────────────────────────────────────────────────────────────────────────────────
obj:
  id: overlay_cd_mini
  width: 290
  height: 120
  align: TOP_LEFT
  x: 15
  y: 110
  bg_color: 0x222222
  bg_opa: 97%
  border_width: 2
  border_color: 0x888888
  radius: 12
  hidden: true
  pad_all: 0
  scrollable: false
  clickable: false
  widgets:

    # ── Zeile 1: Buttons 1–5 ──────────────────────────────────────────────────

    - button:
        id: btn_cdm_1
        width: 52
        height: 54
        align: TOP_LEFT
        x: 6
        y: 4
        bg_color: 0x444444
        border_width: 0
        shadow_width: 0
        outline_width: 0
        radius: 6
        pad_all: 0
        on_click:
          - lambda: |-
              int n = 1;
              int i = id(overlay_cd_slot);
              id(overlay_cd_selected_min)[i] = n;
              id(slot_countdown_max_ms)[i] = (uint32_t)n * 60000U;
              id(slot_is_countdown)[i] = true;
              if (id(overlay_cd_mode) == 0) {
                id(slot_elapsed_ms)[i] = 0;
                id(slot_start_ms)[i] = millis();
                id(slot_status)[i] = 1;
                if (i == 0) {
                  lv_obj_add_flag(id(slot1_default_view), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_clear_flag(id(slot1_running_view), LV_OBJ_FLAG_HIDDEN);
                }
                if (id(auto_rotation)) id(script_schwenker_start)->execute();
                ESP_LOGI("cd_mini", "Slot %d: CD %d min Start", i+1, n);
              }
              lv_obj_add_flag(id(overlay_cd_mini), LV_OBJ_FLAG_HIDDEN);
        widgets:
          - label:
              align: CENTER
              text: "1"
              text_font: font_normal
              text_color: 0xFFFFFF

