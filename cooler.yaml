# ── Komponenten ──────────────────────────────────────────────────────────────────
#  globals:  cooler_system_status_set,
#            icebank_enabled, eisbank_laeuft, eisbank_dauer_min,
#            eisbank_start_ms, thermostat_ziel_x10
#  Steuerung: vollständig in thermostat_steuerung + umwaelzpumpe_steuerung (hardware.yaml, 500ms)
# ─────────────────────────────────────────────────────────────────────────────────

globals:
  - id: cooler_system_status_set
    type: int
    restore_value: true
    initial_value: '0'
    # Werte:
    # 0 = aus
    # 1 = standby
    # 2 = ein
    # 3 = aktiv

  # ── Eisbank ──────────────────────────────────────────────────────────────────
  - id: icebank_enabled
    type: bool
    restore_value: yes
    initial_value: 'false'
    # Schalter: Eisbank-Feature ein/aus (persistiert über Reboot)

  - id: eisbank_laeuft
    type: bool
    restore_value: no
    initial_value: 'false'
    # True solange Eisbank-Modus aktiv läuft

  - id: eisbank_dauer_min
    type: int
    restore_value: yes
    initial_value: '10'
    # Eisbank-Laufzeit in Minuten (0 = deaktiviert, 1–30)

  - id: eisbank_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
    # millis()-Zeitstempel beim Eisbank-Start

  - id: thermostat_ziel_x10
    type: int
    restore_value: yes
    initial_value: '8'
    # Zieltemperatur × 10 (z. B. 8 = 0.8 °C), restore_value: yes

  - id: ice_run_allowed
    type: bool
    restore_value: no
    initial_value: 'true'
    # ICE-Neustart erlaubt? false nach Timer-Ablauf, true nach: temp>soll / Motor-Start / Schalter-Ein

